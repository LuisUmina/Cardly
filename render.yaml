# Render Blueprint for the personal free-tier deployment.
#
# This file belongs to the `personal` branch only. `main` stays an exact mirror
# of the upstream project, which deploys to AWS through infra/aws instead.
#
# Values marked `sync: false` are never stored in this repository: Render asks
# for them when the blueprint is applied, and keeps them in its own secret store.
services:
  - type: web
    name: cardly-backend
    runtime: docker
    plan: free
    # Matches the Neon project region. Postgres latency is on the hot path for
    # every sync request, so the two must not sit on different coasts.
    region: ohio
    branch: personal
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: apps/backend
    # Hits the database, so a healthy check means the process booted AND reached Postgres.
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      # Stays cognito at every step. Step 2 of the runbook boots with placeholder
      # Cognito values instead, because the verifier is lazy and /v1/health is
      # unauthenticated, so no insecure AUTH_MODE=none window is ever needed.
      - key: AUTH_MODE
        value: cognito
      - key: DATABASE_URL
        sync: false
      # Supabase project URL, e.g. https://abcdefgh.supabase.co
      - key: SUPABASE_URL
        sync: false
      # Only the account-deletion path uses this. It bypasses row-level security,
      # so it lives here and never in the auth service, which deletes no users.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # The self-hosted replacement for Secrets Manager. Any long random string;
      # changing it invalidates every outstanding browser CSRF token.
      - key: BACKEND_CSRF_SECRET
        generateValue: true
      # AI chat. The only paid dependency in this deployment; set a spend limit
      # on the key itself, because nothing here caps provider cost.
      - key: OPENAI_API_KEY
        sync: false
      # The MCP surface runs in this same container (entrypoints/serverWithMcp.ts)
      # rather than behind its own gateway, and this is the host it advertises in
      # its OAuth protected-resource metadata.
      - key: MCP_BASE_DOMAIN
        sync: false
      # The chat live SSE stream. Not optional: envelopes.ts refuses to build a
      # conversation envelope for a running run without one, so an unset
      # CHAT_LIVE_URL fails every chat request with CHAT_RESUME_CONTRACT_VIOLATION.
      # Points at the same container through the Vercel proxy, so it stays same-origin.
      - key: CHAT_LIVE_URL
        value: https://cardly-nine.vercel.app/chat-live
      # Signs the short-lived `Live` token the client presents when attaching.
      - key: BACKEND_CHAT_LIVE_AUTH_SECRET
        generateValue: true
      # CHAT_WORKER_FUNCTION_NAME is deliberately unset. Unset selects in-process
      # execution in chat/worker/invoke.ts, which a long-lived container can do
      # and a Lambda cannot.

      - key: PUBLIC_APP_BASE_URL
        sync: false
      - key: BACKEND_ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_API_BASE_URL
        sync: false
      - key: PUBLIC_AUTH_BASE_URL
        sync: false

  - type: web
    name: cardly-auth
    runtime: docker
    plan: free
    # Matches the Neon project region. Postgres latency is on the hot path for
    # every sync request, so the two must not sit on different coasts.
    region: ohio
    branch: personal
    dockerfilePath: apps/auth/Dockerfile
    dockerContext: apps/auth
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8081
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # The publishable key. Every call this service makes is a public auth
      # endpoint, so it never needs the service-role key.
      - key: SUPABASE_ANON_KEY
        sync: false
      # 32 random bytes as hex. Generate with: openssl rand -hex 32
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_REDIRECT_URIS
        sync: false
      - key: PUBLIC_AUTH_BASE_URL
        sync: false
      - key: PUBLIC_API_BASE_URL
        sync: false
      # Required at boot by validateEnv in apps/auth/src/index.ts whenever
      # NODE_ENV is not "development", so it cannot be left unset.
      #
      # Set it to the bare Vercel hostname with NO leading dot, e.g.
      # `cardly.vercel.app`. A leading dot would name `.vercel.app`, which is on
      # the Public Suffix List and which browsers refuse; the exact host is a
      # subdomain of that suffix and is accepted normally.
      - key: COOKIE_DOMAIN
        sync: false
